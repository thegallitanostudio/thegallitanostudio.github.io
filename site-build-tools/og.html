<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Fraunces';src:url(out/fonts/Fraunces.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Fraunces';src:url(out/fonts/Fraunces-Italic.woff2) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Outfit';src:url(out/fonts/Outfit.woff2) format('woff2');font-weight:100 900}
body{margin:0;width:1200px;height:630px;background:#F4F0E0;font-family:Outfit,sans-serif;color:#2F403B;overflow:hidden;position:relative}
.wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 440px;padding:72px 80px;box-sizing:border-box;column-gap:40px;align-items:center}
.mark{display:flex;align-items:center;gap:14px;font-family:Fraunces,serif;font-size:30px;font-weight:500;color:#2B1B3F;letter-spacing:-0.02em;font-variation-settings:'SOFT' 50,'opsz' 144}
h1{margin:34px 0 22px;font-family:Fraunces,serif;font-weight:400;font-size:78px;line-height:.98;letter-spacing:-0.035em;color:#3D524C}
h1 em{font-style:italic;font-weight:300;color:#6B4FD1}
p{margin:0;font-size:24px;line-height:1.45;max-width:560px}
.tag{margin-top:30px;font-size:14px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#3D524C}
.photo{position:relative;height:486px}
.photo img{position:absolute;right:0;top:0;width:360px;height:486px;object-fit:cover;object-position:70% 20%;border-radius:180px 180px 24px 24px}
.photo svg{position:absolute;left:-40px;top:140px}
.icon{position:absolute;width:180px;height:180px;background:#F4F0E0;display:flex;align-items:center;justify-content:center;border-radius:40px}
</style></head><body>
<div class="wrap">
 <div>
  <div class="mark"><svg width="56" height="47" viewBox="0 0 360 300"><circle cx="268" cy="104" r="78" fill="#F1CDE2"/><circle cx="150" cy="156" r="118" fill="#9F7CEF"/><circle cx="296" cy="228" r="46" fill="#C6CD85"/></svg>The Gallitano Studio</div>
  <h1>Be known for who you <em>actually</em> are.</h1>
  <p>Executive story and presence advisory. Your story, in your own words.</p>
  <div class="tag">Huntsville · Madison, Alabama</div>
 </div>
 <div class="photo"><svg width="420" height="350" viewBox="0 0 360 300"><circle cx="268" cy="104" r="78" fill="#F1CDE2"/><circle cx="150" cy="156" r="118" fill="#9F7CEF"/><circle cx="296" cy="228" r="46" fill="#C6CD85"/></svg><img src="out/assets/angela-office.jpg"></div>
</div>
</body></html>
